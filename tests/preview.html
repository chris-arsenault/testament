<!doctype html><html><head><meta charset="utf-8"><title>Local cathedral inspector</title><style>body{margin:0;overflow:hidden;background:#111;color:white;font:11px monospace}canvas{display:block;width:100vw;height:100vh}aside{position:fixed;left:10px;top:10px;padding:9px;background:#071013de;max-width:470px}button{padding:6px;margin:2px;font:11px monospace}pre{white-space:pre-wrap;margin:5px 0}#hide{float:right}</style></head><body><canvas id="view"></canvas><aside><div>LOCAL MODEL INSPECTOR · EXCLUDED FROM PUBLICATION</div><div id="views"></div><button id="evolve">Evolve memory</button><button id="next">Next three witnesses</button><button id="hide">Hide inspector</button><pre id="report"></pre></aside><script type="module">
import {Cathedral} from '/app/rendering.js';import {initial,select} from '/app/world.js';import {witnesses} from '/app/content.js';
let w=initial(),mode='Nave',party=0;const r=new Cathedral(document.querySelector('canvas'));let last=performance.now(),frames=[];
function choose(name){mode=name;w=initial();select(w,[]);Object.assign(w,{x:0,z:9,yaw:0,pitch:.1,skin:true,stable:true});r.cat.position.set(5,.03,-5);r.clock=0;
 if(name==='Stair'){w.place='stair';w.x=5.5;w.z=9;w.yaw=.3;w.pitch=.38;}
 if(name==='Angel'){w.place='garden';w.z=2;w.angel=1;w.pitch=.2;w.roots=true;}
 if(name==='Water'){w.place='water';w.bridge=true;w.z=7;w.pitch=-.12;}
 if(name==='Crypt'){w.place='crypt';w.x=2.7;w.z=-1;w.yaw=.3;w.pitch=.18;}
 if(name==='Cat'){w.x=5;w.z=-7.1;w.y=-.8;w.yaw=Math.PI;w.pitch=-.18;}
 if(name==='Disciples'){w.z=-8.2;w.y=-.6;w.yaw=Math.PI;w.pitch=-.02;select(w,witnesses.slice(party,party+3).map(p=>p.id));for(let i=0;i<3;i++){const id=w.party[i];w.left.push(id);w.waitSpots[id]={x:(i-1)*.95,y:0,z:-5,place:'nave',enthroned:false,alone:0,refusalAt:-10};}w.yaw=Math.PI;}
 if(name==='Buried'){w.place='garden';w.z=-1;w.angel=1;w.underworld=5;w.pitch=.08;}
 if(name==='Stair underside'){w.place='stair';w.x=4.3;w.z=-3;w.yaw=.8;w.pitch=.35;}
 if(name==='Table'){w.x=-3.7;w.z=10.3;w.pitch=-.32;}
 if(name==='Throne claim'){w.place='crypt';w.z=-3;w.pitch=.23;select(w,['peter']);w.left=['peter'];w.waitSpots.peter={x:0,y:1.4,z:-8.8,place:'crypt',enthroned:true,alone:0,refusalAt:-10};}
 frames=[];r.lastPlace="";r.draw(w,0,false);
}
for(const name of ['Nave','Stair','Angel','Water','Crypt','Cat','Disciples','Buried','Stair underside','Table','Throne claim']){const b=document.createElement('button');b.textContent=name;b.onclick=()=>choose(name);document.querySelector('#views').append(b);}
document.querySelector('#evolve').onclick=()=>{w.memory+=2;w.turns++;w.reality=(w.reality+1)%3;w.roots=true;w.ceiling=true;w.passage=true;w.bridge=true;};document.querySelector('#next').onclick=()=>{party=(party+3)%12;choose('Disciples');};document.querySelector('#hide').onclick=()=>document.querySelector('aside').hidden=true;
function frame(now){const dt=(now-last)/1000;last=now;frames.push(dt*1000);if(frames.length>120)frames.shift();r.draw(w,0,false);if(mode==='Disciples'){r.companions.forEach(g=>g.rotation.y=0);r.renderer.render(r.scene,r.camera);}document.querySelector('#report').textContent=JSON.stringify({view:mode,meanFrameMs:Math.round(frames.reduce((a,b)=>a+b,0)/frames.length),drawCalls:r.renderer.info.render.calls,triangles:r.renderer.info.render.triangles,party:w.party},null,2);requestAnimationFrame(frame)}choose('Nave');requestAnimationFrame(frame);
</script></body></html>
