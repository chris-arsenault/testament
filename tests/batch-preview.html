<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local defect inspector</title><style>body{margin:0;background:#111;color:#e7e7d7;font:11px monospace}canvas{position:fixed;inset:0;width:100%;height:100%}aside{position:fixed;left:10px;top:10px;max-width:360px;background:#071115d9;padding:10px}button{padding:7px;margin:2px;background:#263d38;color:white;border:1px solid #74867d}pre{white-space:pre-wrap;max-height:210px;overflow:auto}</style><canvas></canvas><aside>LOCAL DEFECT INSPECTOR — NOT PUBLISHED<br><button id="roots">Roots</button><button id="edge">Stair edge</button><button id="under">Under stairs</button><button id="angel">Angel</button><button id="contact">Contact</button><button id="crypt">Throne</button><br><button id="left">Walk left</button><button id="right">Walk right</button><button id="forward">Walk forward</button><button id="stop">Stop</button><button id="gaze">Gaze</button><button id="wait">Wait / recall</button><button id="leave">Leave</button><button id="alone">Solitude +46</button><pre></pre></aside><script type="module">
import {initial,tick,walk,separate,updateWaiting,touchAngel} from '/app/world.js';import {support} from '/app/space.js';import {Cathedral} from '/app/rendering.js';import {Sound} from '/app/audio.js';
let w=initial(),movement=[0,0],gaze=false;const view=new Cathedral(document.querySelector('canvas')),sound=new Sound();
function set(place,x=0,z=3,y=0){w.place=place;w.x=x;w.z=z;w.y=y;w.vy=0;w.yaw=0;w.pitch=0;movement=[0,0];}
document.querySelector('#roots').onclick=()=>{sound.start();set('nave',1,5);w.roots=true;};document.querySelector('#edge').onclick=()=>{set('stair',1.6,-5,support('stair',0,-5));};document.querySelector('#under').onclick=()=>set('stair',3,-5);document.querySelector('#angel').onclick=()=>{sound.start();set('garden',0,2);w.angel=1;};document.querySelector('#contact').onclick=()=>{sound.start();set('garden',0,-8);w.angel=1;touchAngel(w);};document.querySelector('#crypt').onclick=()=>{sound.start();set('crypt',0,-4);w.throne=true;};
document.querySelector('#left').onclick=()=>movement=[-1,0];document.querySelector('#right').onclick=()=>movement=[1,0];document.querySelector('#forward').onclick=()=>movement=[0,-1];document.querySelector('#stop').onclick=()=>movement=[0,0];document.querySelector('#gaze').onclick=()=>{sound.start();gaze=!gaze;};document.querySelector('#wait').onclick=()=>separate(w,0,view.waitTarget(w));document.querySelector('#leave').onclick=()=>set('nave');document.querySelector('#alone').onclick=()=>updateWaiting(w,46);
let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;walk(w,movement[0]*dt*2,movement[1]*dt*2);tick(w,dt,{moving:!!(movement[0]||movement[1]),...(gaze?view.target(w):{target:'none'})});if(w.events.length)sound.event(w.events.shift());sound.update(w);view.draw(w,dt,false);document.querySelector('pre').textContent=JSON.stringify({place:w.place,x:+w.x.toFixed(2),y:+w.y.toFixed(2),z:+w.z.toFixed(2),attention:+w.attention.toFixed(2),gaze:w.gazeId,underworld:+w.underworld.toFixed(2),wait:w.waitSpots,drawCalls:view.renderer.info.render.calls,triangles:view.renderer.info.render.triangles},null,2);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
