<!doctype html><html><head><meta charset="utf-8"><title>Local cathedral inspector</title><style>body{margin:0;background:#111;color:white;font:12px monospace}canvas{width:100vw;height:100vh}aside{position:fixed;left:10px;top:10px;padding:10px;background:#000b;max-width:380px}button{padding:10px;margin:3px}pre{white-space:pre-wrap}</style></head><body><canvas id="view"></canvas><aside><div>LOCAL DEVELOPMENT INSPECTOR — excluded from publication</div><button data-place="nave">Nave</button><button data-place="stair">Stair</button><button data-place="garden">Angel</button><button data-place="water">Water</button><button data-place="crypt">Crypt</button><button id="evolve">Evolve memory</button><pre id="report"></pre></aside><script type="module">
import {Cathedral} from '/app/rendering.js';import {initial,tick,cross} from '/app/world.js';const w=initial(),r=new Cathedral(document.querySelector('canvas'));w.z=3;w.pitch=.12;document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{w.place=b.dataset.place;w.z=w.place==='stair'?9:3;w.angel=w.place==='garden'?1:0;});document.querySelector('#evolve').onclick=()=>{w.memory+=2;w.turns++;w.reality=(w.reality+1)%3;w.roots=true;w.ceiling=true;w.passage=true;w.bridge=true;};let last=performance.now(),frames=[];function frame(now){const dt=(now-last)/1000;last=now;frames.push(dt*1000);if(frames.length>180)frames.shift();r.draw(w,Math.min(dt,.05),false);document.querySelector('#report').textContent=JSON.stringify({place:w.place,meanFrameMs:Math.round(frames.reduce((a,b)=>a+b,0)/frames.length),drawCalls:r.renderer.info.render.calls,triangles:r.renderer.info.render.triangles,memory:w.memory},null,2);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
